name: LibreFlow
options:
  bundleIdPrefix: app.libreflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  LibreFlow:
    type: application
    platform: iOS
    sources:
      - path: LibreFlow
        excludes:
          - "Web/**"
      - path: LibreFlow/Web
        type: folder
        buildPhase: resources
    # Signing team and bundle id are personal: they live in Local.xcconfig (not in git; copy Local.xcconfig.example)
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    preBuildScripts:
      - name: Build analysis page from libreflow.html
        script: |
          python3 "${PROJECT_DIR}/tools/make_app_page.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: LibreFlow
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: LibreFlow
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "LibreFlow reads your trainings directly from your Polar watch via Bluetooth. Nothing on the watch is changed."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    info:
      path: LibreFlow/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDisplayName: LibreFlow
        NSBluetoothAlwaysUsageDescription: "LibreFlow reads your trainings directly from your Polar watch via Bluetooth. Nothing on the watch is changed."
        UILaunchScreen: {}
